# CGA BRCG derrière le nginx du serveur (backend-nginx-1). ÉTAPE 2 SUR 2 : le port 80 (validation, redirection)
# puis les trois sites en https, sur un seul certificat (/etc/letsencrypt/live/cga-brcg.horus-lab.com/).
# Posé par `certificats.sh` une fois le certificat émis.
server {
    listen 80;
    listen [::]:80;
    server_name cga-brcg.horus-lab.com console.cga-brcg.horus-lab.com api.cga-brcg.horus-lab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ⚠️ RÉSOLUTION AU MOMENT DE LA REQUÊTE (résolveur Docker + nom dans une variable), comme les
# autres projets du serveur : un nom en clair serait résolu au chargement, et nginx refuserait
# de démarrer tant que CGA n'est pas monté, entraînant tous les autres sites de la machine.
# Avec une variable, nginx n'ajoute plus le chemin : on écrit $request_uri soi-même.
#
# Les routes qui vérifient un secret : l'API limite déjà par compte et par adresse, ceci arrête
# l'acharnement avant qu'il ne l'atteigne.
limit_req_zone $binary_remote_addr zone=cga_auth:10m rate=10r/m;

# ------------------------------------------------------------------ le site public
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cga-brcg.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/cga-brcg.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cga-brcg.horus-lab.com/privkey.pem;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Les documents joints à une demande : 10 Mo chacun côté serveur.
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        set $cga_vitrine cga-vitrine:3000;
        proxy_pass http://$cga_vitrine$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ------------------------------------------------------------------ la console et l'espace adhérent
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.cga-brcg.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/cga-brcg.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cga-brcg.horus-lab.com/privkey.pem;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Une pièce justificative ou un scan : 20 Mo au plus côté serveur.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        set $cga_console cga-console:3000;
        proxy_pass http://$cga_console$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ------------------------------------------------------------------ l'API (application mobile)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.cga-brcg.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/cga-brcg.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cga-brcg.horus-lab.com/privkey.pem;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;
    proxy_read_timeout 120s;

    location ~ ^/transverse/(session|mot-de-passe|activation|second-facteur) {
        limit_req zone=cga_auth burst=10 nodelay;
        limit_req_status 429;
        set $cga_api cga-api:8000;
        proxy_pass http://$cga_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $cga_api cga-api:8000;
        proxy_pass http://$cga_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
