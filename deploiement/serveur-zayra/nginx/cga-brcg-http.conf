# CGA BRCG derrière le nginx du serveur (backend-nginx-1). ÉTAPE 1 SUR 2 : le port 80 seul,
# pour que Let's Encrypt valide les trois noms (HTTP-01), et la redirection vers https.
# Remplacé par `cga-brcg.conf` une fois le certificat émis (voir `certificats.sh`).
server {
    listen 80;
    listen [::]:80;
    server_name cga-brcg.horus-lab.com console.cga-brcg.horus-lab.com api.cga-brcg.horus-lab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
