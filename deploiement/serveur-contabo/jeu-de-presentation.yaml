# Le jeu de la recette en présentiel (20 octobre 2026), versé PAR-DESSUS le jeu de démonstration.
#
#     /opt/cga/presentation.sh ouvrir      # verse la démonstration, puis ce fichier
#
# ⚠️ TOUT EST FICTIF : noms, NIU, adresses. Le mot de passe de chaque compte est celui de la
# démonstration. Pour ajouter des clients d'une séance à l'autre, compléter la liste `clients`
# et relancer `presentation.sh completer` : ce qui existe déjà est passé, rien n'est réécrit.
#
# Rôles : CHARGE_CLIENTELE, CHARGE_FORMALITES, COMPTABLE, REVISEUR, FISCALISTE, DIRECTION,
# ADMINISTRATEUR, CAISSE, SUPER_ADMIN, INSPECTEUR, ADHERENT, CLIENT_CREATION.
# Portée : « tout », une liste de NIU, ou la référence d'un dossier de création (CR-…).
mot_de_passe: cabinet brcg douala 2026

equipe:
  # La juriste, à part de la chargée de clientèle : la qualification d'une création, les
  # formalités, les prestations ponctuelles (analyse et rédaction de contrats).
  - {prenom: Julienne, nom: ATEBA, courriel: j.ateba@cga-brcg.cm, role: CHARGE_FORMALITES, portee: tout,
     precision: "Juriste du cabinet"}
  # Le client d'une création en cours (TECHNO SERVICES SARL, étape constitution) : il suit son
  # dossier et y verse ses pièces depuis son compte.
  - {prenom: Estelle, nom: MBARGA, courriel: e.mbarga@technoservices.cm, role: CLIENT_CREATION,
     portee: CR-2026-0012, precision: "Client de la création CR-2026-0012"}

