# La pile complète : base, migration, API, console, vitrine.
#
# ─────────────────────────────────────────────────────────────────────────────
#     docker compose up --build
#
# Puis http://localhost:3000 pour la console et http://localhost:3001 pour le
# site public. ⚠️ Ces ports se règlent — `PORT_API`, `PORT_CONSOLE`,
# `PORT_VITRINE` — parce que sur un poste de développement quelque chose occupe
# toujours 8000 :
#
#     PORT_API=8100 PORT_CONSOLE=3100 PORT_VITRINE=3101 docker compose up --build Les identifiants de démonstration sont ceux de `app/amorcage.py`,
# dans le dépôt du serveur.
#
# ⚠️ LES QUATRE DÉPÔTS DOIVENT ÊTRE CLONÉS CÔTE À CÔTE
#
# Ce fichier construit des images à partir de dépôts VOISINS : `../erp-cga-backend`,
# `../erp-cga-console`, `../erp-cga-vitrine`. C'est la contrepartie de la
# scission, et elle est délibérée : recopier les sources ici créerait une
# seconde vérité sur ce qu'est le produit.
#
#     git clone …/erp-cga-backend
#     git clone …/erp-cga-console
#     git clone …/erp-cga-vitrine
#     git clone …/erp-cga-plateforme && cd erp-cga-plateforme
#
# ⚠️ LA BASE MONTE VIDE. Les migrations créent le schéma ; elles ne versent aucune
# donnée, et c'est voulu — un amorçage automatique finirait par s'exécuter contre
# une base réelle. Pour une démonstration :
#
#     docker compose exec -e CGA_MODE_DEMONSTRATION=true api \
#       python -c "from app.amorcage import amorcer; print(amorcer())"
#
# Vérifier que le cloisonnement s'applique vraiment, et ne pas s'en remettre au
# fait que la pile démarre :
#
#     curl -s localhost:${PORT_API:-8000}/sante     → "cloisonnement": "APPLIQUE"
#
# ⚠️ CE FICHIER N'EST PAS UNE CONFIGURATION DE PRODUCTION
#
# Il décrit une pile **complète et locale** : celle qui permet de vérifier que
# les images se construisent, que la migration passe et que les quatre services
# se parlent. Trois choses l'écartent explicitement d'un déploiement réel :
#
#   · le mot de passe de la base est en clair et connu ;
#   · rien n'est chiffré, aucun mandataire inverse ne termine le TLS ;
#   · le volume vit sur la machine, sans sauvegarde.
#
# La production ajoute un mandataire, des secrets tenus par l'orchestrateur, et
# une base infogérée dont quelqu'un vérifie les sauvegardes. Ce fichier ne
# prétend pas s'y substituer, et le dire ici évite qu'on le croie.
# ─────────────────────────────────────────────────────────────────────────────

name: cga

services:
  # ── La base ───────────────────────────────────────────────────────────────
  base:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cga
      POSTGRES_PASSWORD: cga
      POSTGRES_DB: cga
      # Le tri et les classes de caractères sont figés : ils décident de l'ordre
      # des dénominations sociales accentuées et de la comparaison des adresses
      # électroniques. Les laisser à la valeur de l'hôte donnerait un ordre
      # d'affichage différent selon la machine.
      LANG: fr_FR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      # ⚠️ `pg_isready` seul répond « prêt » pendant l'initialisation, avant que
      # la base applicative n'existe. Nommer l'utilisateur **et** la base évite
      # que la migration ne démarre trop tôt et n'échoue une fois sur deux.
      test: ["CMD-SHELL", "pg_isready -U cga -d cga"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Les deux rôles PostgreSQL ─────────────────────────────────────────────
  #
  # ⚠️ SANS CE SERVICE, LE CLOISONNEMENT MULTI-CABINET NE S'APPLIQUE PAS.
  #
  # L'image officielle de PostgreSQL crée `POSTGRES_USER` en SUPERUTILISATEUR.
  # Une application connectée avec lui contourne toutes les politiques de
  # sécurité au niveau des lignes, sans exception possible : le cloisonnement
  # repose alors sur le seul filtre applicatif, et le moindre SQL textuel le
  # traverse.
  #
  # La pile le disait pourtant à chaque démarrage, dans le journal de l'API :
  #
  #     CLOISONNEMENT NON APPLIQUÉ : le rôle « cga » est superutilisateur
  #
  # Personne ne lit le journal d'un conteneur qui démarre bien. Il a fallu
  # monter la pile pour de bon, et regarder, pour que la ligne se voie.
  #
  # Le script crée `cga_migration`, qui possède les tables, et `cga_app`, qui
  # ne possède rien et reste soumis aux politiques. Il est idempotent et se
  # rejoue à chaque montée sans dommage.
  roles:
    image: postgres:16-alpine
    volumes:
      - ../erp-cga-backend/outils/roles-postgresql.sql:/roles.sql:ro
    environment:
      PGPASSWORD: cga
    # ⚠️ Les mots de passe sont en clair, comme celui de la base : voir l'en-tête,
    # ce fichier n'est pas une configuration de production.
    command: >-
      psql -h base -U cga -d cga
           -v mot_de_passe_migration="'migration'"
           -v mot_de_passe_app="'app'"
           -f /roles.sql
    depends_on:
      base:
        condition: service_healthy
    restart: "no"

  # ── La migration ──────────────────────────────────────────────────────────
  #
  # Un service à part, qui s'exécute une fois et sort. C'est délibéré : mise à
  # l'échelle à trois instances d'API, trois `alembic upgrade` partiraient
  # ensemble sur la même base. Alembic pose bien un verrou, mais compter sur lui
  # pour arbitrer un démarrage simultané est un pari, pas une conception.
  migration:
    build:
      context: ../erp-cga-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      # ⚠️ `cga_migration` et non `cga` : c'est le rôle qui doit POSSÉDER les
      # tables. Migrer avec le superutilisateur les lui donnerait, et le
      # propriétaire d'une table contourne ses propres politiques.
      CGA_URL_BASE_DE_DONNEES: postgresql+psycopg://cga_migration:migration@base:5432/cga
    depends_on:
      base:
        condition: service_healthy
      roles:
        condition: service_completed_successfully
    restart: "no"

  # ── L'API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../erp-cga-backend
    environment:
      CGA_ENVIRONNEMENT: local
      CGA_PERSISTANCE: postgresql
      # ⚠️ `cga_app` : sans superutilisateur, sans BYPASSRLS, propriétaire de
      # rien. C'est la condition pour que les politiques s'appliquent à lui.
      # `GET /sante` rend « cloisonnement: APPLIQUE » quand c'est le cas.
      CGA_URL_BASE_DE_DONNEES: postgresql+psycopg://cga_app:app@base:5432/cga
      CGA_ORIGINES_CORS: '["http://localhost:3000","http://localhost:3001"]'
      CGA_ADRESSE_PUBLIQUE: http://localhost:8000
      CGA_ADRESSE_PUBLIQUE_SITE: http://localhost:3000
      CGA_DOSSIER_FICHIERS: /application/fichiers
      # ⚠️ Aucun relais de messagerie : les courriels sont **retenus**, pas
      # envoyés. C'est voulu — une pile locale ne doit écrire à personne. Voir
      # `notifications_smtp.py`.
      #
      # ⚠️ Aucune clé de chiffrement non plus : les secrets TOTP sont écrits en
      # clair. Acceptable ici — données de démonstration —, refusé en production
      # par la configuration elle-même.
    volumes:
      # ⚠️ Sans ce volume, les justificatifs vivent dans la couche du conteneur
      # et **disparaissent au redéploiement**. La base survivrait, elle : on
      # aurait donc des pièces référencées dont le document n'existe plus, et
      # l'incohérence ne se découvrirait qu'au moment de produire une facture
      # devant un vérificateur.
      - justificatifs:/application/fichiers
    ports:
      # ⚠️ LE PORT DE L'HÔTE SE RÈGLE, ET CE N'EST PAS DU CONFORT.
      #
      # Codé en dur, il entre en conflit avec tout ce qui tourne déjà sur la
      # machine — et sur un poste de développement, quelque chose tourne
      # toujours sur 8000. La pile refuse alors de monter, avec un message qui
      # parle de liaison de port et non du projet, et l'on croit à une panne de
      # la pile. C'est arrivé au premier essai : 8000 et 3001 étaient pris par
      # deux autres projets.
      #
      # Le port INTERNE, lui, ne bouge pas : c'est celui que les services
      # emploient entre eux, et le changer casserait `api:8000`.
      - "${PORT_API:-8000}:8000"
    depends_on:
      base:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── La console ────────────────────────────────────────────────────────────
  console:
    build:
      context: ../erp-cga-console
      # ⚠️ EN ARGUMENT DE CONSTRUCTION, et non en variable d'environnement.
      # Tout ce qui porte `NEXT_PUBLIC_` est recopié dans le paquet envoyé au
      # navigateur au moment de la compilation : le poser au démarrage ne change
      # rien, et le lien garde l'adresse par défaut sans que rien ne le signale.
      args:
        NEXT_PUBLIC_ADRESSE_VITRINE: http://localhost:${PORT_VITRINE:-3001}
    environment:
      # ⚠️ `api:8000` est le nom du service sur le réseau interne, joignable
      # seulement depuis un autre conteneur. Correct ici parce que le front
      # appelle l'API **depuis son serveur**, jamais depuis le navigateur —
      # c'est tout l'objet de `app/lib/api.ts`. Une variable `NEXT_PUBLIC_*`
      # portant cette valeur casserait aussitôt : le navigateur ne résout pas
      # `api`.
      API_URL: http://api:8000
    ports:
      - "${PORT_CONSOLE:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ── La vitrine ────────────────────────────────────────────────────────────
  #
  # ⚠️ Deux images et non une, depuis la scission. C'était une seule application
  # servant le site public et l'espace de travail, et c'est justement ce que la
  # scission a défait : le site public se déploie quand le cabinet publie un
  # article, la console quand un comptable a besoin d'un écran. Les lier obligeait
  # à redéployer l'un pour l'autre.
  vitrine:
    build:
      context: ../erp-cga-vitrine
      # ⚠️ Voir la console : à la construction, jamais au démarrage.
      args:
        NEXT_PUBLIC_ADRESSE_CONSOLE: http://localhost:${PORT_CONSOLE:-3000}
    environment:
      API_URL: http://api:8000
    ports:
      - "${PORT_VITRINE:-3001}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  donnees_postgres:
  justificatifs:
