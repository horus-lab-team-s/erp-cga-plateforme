# Ce qui doit être vrai avant qu'un changement n'entre dans `main`.
#
# ─────────────────────────────────────────────────────────────────────────────
# CE QUE CETTE CHAÎNE VÉRIFIE, ET CE QU'ELLE NE PEUT PAS VÉRIFIER
#
# Ce dépôt porte la conception, la recette, le référentiel de déploiement et le
# site qui sert la documentation. Ce qui s'y vérifie sans rien d'autre :
#
#   · le site de conception se construit, et le document qu'il sert est bien
#     relu à la construction. C'est ce qui empêche la page publiée de dériver de
#     sa source ;
#   · le document ne contient pas de tiret cadratin. La règle est du projet, pas
#     du goût : elle tient sur toute la langue publiée.
#
# ⚠️ CE QUI NE S'Y VÉRIFIE PAS, ET OÙ C'EST VÉRIFIÉ
#
# Les manifestes de déploiement décrivent la configuration du serveur, et c'est
# `test_manifestes_kubernetes.py`, dans `erp-cga-backend`, qui refuse une
# variable qui ne correspond à aucun champ de `Configuration` — l'orchestrateur
# les accepte, l'application les ignore, et le réglage voulu ne s'applique
# jamais. Cette chaîne-ci ne peut pas le faire : elle n'a pas le code du serveur.
#
# La recette de bout en bout, elle, demande la pile entière — base, API, console,
# vitrine. Elle se joue à la main avant une mise en production, et le registre
# des soixante-quinze cas d'usage est dans `Docs/recette/`.
# ─────────────────────────────────────────────────────────────────────────────

name: Vérification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site de conception — importation du document et compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Site_conception

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Site_conception/package-lock.json

      - name: Installer
        run: npm ci

      - name: Importer le document
        # ⚠️ L'étape qui empêche la page publiée de dériver de sa source. Le site
        # ne recopie pas le document : il le relit à chaque construction, depuis
        # `Docs/architecture/document-de-conception/`. C'est la raison pour
        # laquelle les deux vivent dans le même dépôt.
        run: node outils/importer-le-document.mjs

      - name: Le contenu versionné dit la même chose que le document
        # ⚠️ L'étape qui donne sa valeur à la précédente.
        #
        # Ce que l'importateur engendre est versionné, pour que le site se
        # déploie depuis un service d'hébergement qui n'exécute que
        # `npm run build`. L'avantage a un revers : on peut publier une version
        # du contenu qui ne correspond plus au document, et rien ne le dirait.
        # Rejouer l'importation puis comparer est ce qui ferme cette porte.
        working-directory: .
        run: |
          if ! git diff --quiet -- Site_conception/contenu; then
            echo "::error::le contenu publié a dérivé du document. Rejouer :"
            echo "  cd Site_conception && node outils/importer-le-document.mjs"
            git diff --stat -- Site_conception/contenu
            exit 1
          fi
          echo "le contenu publié correspond au document"

      - name: Compilation
        run: npm run build

  langue:
    name: Langue — aucun tiret cadratin dans le document publié
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Le document
        # ⚠️ La règle porte sur le document de conception, qui est publié et lu
        # par des tiers. Un tiret cadratin s'y glisse sans qu'on le voie en
        # relecture : il ressemble à un trait d'union un peu long.
        run: |
          fichier=Docs/architecture/document-de-conception/architecture-multitenant-cga.html
          if grep -q "—" "$fichier"; then
            echo "::error::tiret cadratin dans le document de conception"
            grep -n -m 20 "—" "$fichier"
            exit 1
          fi
          echo "aucun tiret cadratin"
